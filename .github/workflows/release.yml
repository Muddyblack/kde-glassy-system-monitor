name: Release

on:
  # Merging a release PR (scripts/tag.sh / make tag) bumps the version in
  # package/metadata.json on master. That push is the release: the tag does not exist yet,
  # this workflow creates it together with the GitHub release.
  push:
    branches: [master]
    paths: [package/metadata.json]
  workflow_dispatch:

# One release at a time, and never cancel a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reads the version from package/metadata.json and works out whether it still needs a
  # release. Pushes that touch the file without bumping the version (or that
  # re-run an already released one) stop here.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and whether it is released
        id: v
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="$(jq -r .KPlugin.Version package/metadata.json)"
          TAG="v${VERSION}"
          NEW=true
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::Releases are only cut from $DEFAULT_BRANCH."
            NEW=false
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} is already released."
            NEW=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "new=$NEW"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .plasmoid
        run: make pack

      - name: Get version and artifact path
        id: info
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NAME="$(basename "$PWD")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME}-${VERSION}.plasmoid" >> "$GITHUB_OUTPUT"

      # The notes are whatever the release PR's description says between the
      # release-notes markers (tag.sh drafts them there, you can edit them
      # before merging). Without that, fall back to the commit list.
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].body // ""' \
            | tr -d '\r' \
            | sed -n '/<!-- release-notes:start -->/,/<!-- release-notes:end -->/p' \
            | sed '1d;$d' || true)"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '1p')"
            if [ -n "$PREV_TAG" ]; then
              NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
            else
              NOTES="$(git log --pretty=format:'- %s' --no-merges)"
            fi
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.version }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            Install by downloading the `.plasmoid` file and running:
            ```
            plasmapkg2 -i ${{ steps.info.outputs.artifact }}
            ```
          files: ${{ steps.info.outputs.artifact }}
